name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:
  pull_request:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v5
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Run Azure Machine Learning training job
      run: |
        RG=$(az group list --query "[?starts_with(name,'rg-ai300-l')].name | [0]" -o tsv)
        WS=$(az ml workspace list -g $RG --query "[?starts_with(name,'mlw-ai300-l')].name | [0]" -o tsv)
        echo "Using $RG / $WS"
        az ml job create -f src/job.yml -g $RG -w $WS